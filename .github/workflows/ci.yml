name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check bteng_moveit/
      - run: ruff format --check bteng_moveit/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest test/ -v
      # The end-to-end promise, on a runner with no ROS 2 at all: every tree
      # parses, every tag resolves, every params value validates.
      - run: bteng-moveit run examples/trees/ -p examples/config/moveit_params.yaml --dry-run --plain
      - run: bteng-moveit nodes --long
